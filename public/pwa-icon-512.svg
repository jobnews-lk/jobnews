<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Transparent Background so it merges seamlessly into #1e3a8a -->
  <rect width="512" height="512" fill="none" />

  <!-- Frosted Glass Card -->
  <g filter="url(#soft-glow)">
    <rect x="176" y="105" width="160" height="160" rx="36" fill="url(#card-grad)" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.35" />
    
    <!-- Briefcase Body -->
    <rect x="216" y="165" width="80" height="56" rx="10" fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
    <!-- Briefcase Handle -->
    <path d="M238 165 V150 C238 144 243 140 249 140 H263 C269 140 274 144 274 150 V165" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Latch Line -->
    <line x1="216" y1="185" x2="296" y2="185" stroke="#ffffff" stroke-width="6" />

    <!-- Magnifying Glass Search Badge -->
    <circle cx="295" cy="225" r="25" fill="#f59e0b" stroke="#ffffff" stroke-width="5" />
    <circle cx="292" cy="222" r="9" fill="none" stroke="#ffffff" stroke-width="4.5" />
    <line x1="298" y1="228" x2="308" y2="238" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- JobNews.lk Typography -->
  <text x="256" y="340" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">
    JobNews<tspan fill="#93c5fd">.lk</tspan>
  </text>

  <!-- Tagline -->
  <text x="256" y="380" text-anchor="middle" fill="#bfdbfe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" letter-spacing="3.5">
    YOUR CAREER, OUR MISSION
  </text>
</svg>
