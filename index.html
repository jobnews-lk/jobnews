<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>JobNews.lk - Sri Lanka's Latest Job Vacancies</title>
    
    <!-- Anti-FOUC Zero-Latency Theme Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
          root.style.backgroundColor = (theme === 'dark') ? '#0f172a' : '#ffffff';
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Find the latest Government, Private, and Overseas job vacancies in Sri Lanka. JobNews.lk is your trusted portal for official Sri Lanka Gazette job announcements." />
    <meta name="keywords" content="Sri Lanka Job Vacancies, Government Jobs Sri Lanka, Gazette Jobs 2026, Sri Lanka Gazette, Private Sector Jobs Sri Lanka, Overseas Jobs Sri Lanka, JobNews.lk, ශ්‍රී ලංකා රජයේ රැකියා, ගැසට් නිවේදන, රැකියා ඇබෑර්තු" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://jobnews.lk" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Open Graph / Facebook / WhatsApp -->

    <!-- Schema.org JSON-LD Structured Data for Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "JobNews.lk",
        "url": "https://jobnews.lk",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://jobnews.lk/jobs?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
